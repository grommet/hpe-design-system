name: Require design tokens Changeset

on:
  pull_request:
    branches:
      - master
    paths:
      - packages/hpe-design-tokens/tokens/**
      - packages/hpe-design-tokens/src/**
      - packages/hpe-design-tokens/contracts/**
      - .changeset/**
      - scripts/validate-design-tokens-changeset.mjs
      - package.json
      - .github/workflows/design-tokens-changeset-check.yml

permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Validate token Changeset
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm validate:design-tokens-changeset
