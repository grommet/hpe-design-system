name: Release hpe-design-tokens

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Approved commit or branch to release'
        required: true
        default: 'master'
        type: string
      version:
        description: 'Exact package version to release, for example 2.3.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hpe-design-tokens-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.15.0'
  PNPM_VERSION: '10.30.3'
  PACKAGE_NAME: hpe-design-tokens
  RELEASE_TAG: hpe-design-tokens@${{ inputs.version }}

jobs:
  candidate:
    name: Build release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release preflight
        run: pnpm --filter ${{ env.PACKAGE_NAME }} release:preflight

      - name: Validate approved version and package boundary
        run: pnpm --filter ${{ env.PACKAGE_NAME }} release:validate -- --version=${{ inputs.version }}

      - name: Create immutable package artifact
        run: pnpm --filter ${{ env.PACKAGE_NAME }} release:pack

      - name: Record checked-out commit metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e "const fs=require('fs'); const packageJson=require('./packages/hpe-design-tokens/package.json'); fs.writeFileSync('./packages/hpe-design-tokens/release-artifacts/release-metadata.json', JSON.stringify({package: packageJson.name, version: packageJson.version, commit_sha: require('child_process').execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(), requested_version: process.env.REQUESTED_VERSION}, null, 2) + '\\n')"

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hpe-design-tokens-${{ inputs.version }}
          path: |
            packages/hpe-design-tokens/release-artifacts/*.tgz
            packages/hpe-design-tokens/release-artifacts/release-metadata.json
          if-no-files-found: error
