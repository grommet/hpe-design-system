name: Stage HPE design icons for NPM approval

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful HPE icon candidate workflow run ID'
        required: true
        type: string
      package:
        description: 'Package represented by the candidate artifact'
        required: true
        type: choice
        options:
          - '@hpe-design/icons-grommet'
          - '@hpe-design/icons-svg'
      version:
        description: 'Exact package version from the candidate artifact'
        required: true
        type: string
      commit_sha:
        description: 'Exact commit SHA recorded by the candidate workflow'
        required: true
        type: string
      release_notes:
        description: 'Human-written release notes for the draft GitHub release'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hpe-icons-publish-${{ inputs.package }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.15.0'
  CANDIDATE_WORKFLOW: hpe-icons-release-candidate.yml
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  prepare:
    name: Prepare HPE icon release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      package_id: ${{ steps.package.outputs.package_id }}
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      - name: Require default-branch dispatch
        env:
          WORKFLOW_REF: ${{ github.ref_name }}
        run: test "$WORKFLOW_REF" = "$DEFAULT_BRANCH"

      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate package and release identifiers
        id: package
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          case "$PACKAGE_NAME" in
            @hpe-design/icons-grommet)
              package_id=grommet
              ;;
            @hpe-design/icons-svg)
              package_id=svg
              ;;
            *)
              echo "Unsupported package: $PACKAGE_NAME" >&2
              exit 1
              ;;
          esac

          release_tag="${PACKAGE_NAME}@${REQUESTED_VERSION}"
          git check-ref-format "refs/tags/$release_tag"
          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Validate successful candidate workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$CANDIDATE_RUN_ID")
          test "$(jq -r '.path' <<<"$run")" = ".github/workflows/$CANDIDATE_WORKFLOW"
          test "$(jq -r '.event' <<<"$run")" = "workflow_dispatch"
          test "$(jq -r '.status' <<<"$run")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run")" = "success"
          test "$(jq -r '.head_branch' <<<"$run")" = "$DEFAULT_BRANCH"
          test "$(jq -r '.head_sha' <<<"$run")" = "$EXPECTED_SHA"

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: hpe-icons-${{ steps.package.outputs.package_id }}-${{ inputs.version }}-candidate
          path: candidate-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify candidate package, version, commit, and digest
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -o pipefail
          shopt -s nullglob
          tarballs=(candidate-artifact/*.tgz)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          metadata=candidate-artifact/release-metadata.json
          test -f "$metadata"

          jq -e \
            --arg package "$PACKAGE_NAME" \
            --arg version "$REQUESTED_VERSION" \
            --arg sha "$REQUESTED_SHA" \
            '.package == $package and .version == $version and .requested_version == $version and .commit_sha == $sha and .npm_cli_version == "11.15.0"' \
            "$metadata" >/dev/null

          actual_name=$(tar -xOf "$tarball" package/package.json | jq -r '.name')
          actual_version=$(tar -xOf "$tarball" package/package.json | jq -r '.version')
          test "$actual_name" = "$PACKAGE_NAME"
          test "$actual_version" = "$REQUESTED_VERSION"
          expected_sha=$(cat candidate-artifact/tarball.sha256)
          actual_sha=$(sha256sum "$tarball" | cut -d ' ' -f1)
          test "$actual_sha" = "$expected_sha"

      - name: Create or verify package version tag
        env:
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            local_tag_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
            if [[ "$local_tag_sha" != "$EXPECTED_SHA" ]]; then
              echo "Local tag $RELEASE_TAG points to $local_tag_sha, expected $EXPECTED_SHA." >&2
              exit 1
            fi
          fi

          remote_refs=$(git ls-remote --tags origin \
            "refs/tags/$RELEASE_TAG" \
            "refs/tags/$RELEASE_TAG^{}")
          if [[ -n "$remote_refs" ]]; then
            remote_tag_sha=$(awk '
              $2 ~ /\^\{\}$/ { peeled=$1 }
              $2 !~ /\^\{\}$/ { direct_sha=$1 }
              END {
                if (peeled != "") print peeled
                else print direct_sha
              }
            ' <<< "$remote_refs")
            if [[ "$remote_tag_sha" != "$EXPECTED_SHA" ]]; then
              echo "Remote tag $RELEASE_TAG points to $remote_tag_sha, expected $EXPECTED_SHA." >&2
              exit 1
            fi
            echo "Verified existing version tag $RELEASE_TAG at $EXPECTED_SHA."
            exit 0
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag -a "$RELEASE_TAG" "$EXPECTED_SHA" -m "$RELEASE_TAG"
          fi
          git push origin "refs/tags/$RELEASE_TAG"
          echo "Created and pushed $RELEASE_TAG at $EXPECTED_SHA."

      - name: Prepare GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          test -n "$RELEASE_NOTES"
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md

          release_json=$(mktemp)
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$release_json" 2>/dev/null; then
            jq -e '.isDraft == true' "$release_json" >/dev/null
            draft_target=$(jq -r '.targetCommitish' "$release_json")
            if [[ "$draft_target" != "$COMMIT_SHA" ]]; then
              releases=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
              release_id=$(jq -er --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag and .draft == true)][0].id' <<< "$releases")
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
                -f target_commitish="$COMMIT_SHA" >/dev/null
              echo "Updated the existing unpublished draft to the validated candidate commit; release notes are unchanged."
            else
              echo "Reusing the matching draft release. Review its notes before publication."
            fi
          else
            gh release create "$RELEASE_TAG" \
              --target "$COMMIT_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --draft
          fi

  stage_npm:
    name: Stage or verify HPE icon release
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: npm-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI with staged-publishing support
        run: npm install --global npm@11.15.0

      - name: Verify npm trusted-publishing client version
        run: |
          IFS=. read -r npm_major npm_minor npm_patch <<< "$(npm --version)"
          if (( npm_major < 11 || (npm_major == 11 && npm_minor < 15) )); then
            echo "npm 11.15.0 or later is required for staged publishing." >&2
            exit 1
          fi

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: hpe-icons-${{ needs.prepare.outputs.package_id }}-${{ inputs.version }}-candidate
          path: candidate-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Stage or verify HPE icon release
        id: npm_stage
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -o pipefail
          shopt -s nullglob
          tarballs=(candidate-artifact/*.tgz)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          metadata=candidate-artifact/release-metadata.json
          test -f "$metadata"

          jq -e \
            --arg package "$PACKAGE_NAME" \
            --arg version "$REQUESTED_VERSION" \
            --arg sha "$REQUESTED_SHA" \
            '.package == $package and .version == $version and .requested_version == $version and .commit_sha == $sha and .npm_cli_version == "11.15.0"' \
            "$metadata" >/dev/null

          actual_sha=$(sha256sum "$tarball" | cut -d ' ' -f1)
          test "$actual_sha" = "$(cat candidate-artifact/tarball.sha256)"
          test "$(tar -xOf "$tarball" package/package.json | jq -r '.name')" = "$PACKAGE_NAME"
          test "$(tar -xOf "$tarball" package/package.json | jq -r '.version')" = "$REQUESTED_VERSION"
          : > npm-stage-output.txt

          if npm view "$PACKAGE_NAME@$REQUESTED_VERSION" version >/dev/null 2>&1; then
            registry_tarball=$(npm view "$PACKAGE_NAME@$REQUESTED_VERSION" dist.tarball)
            curl --fail --location "$registry_tarball" --output registry-package.tgz
            registry_sha=$(sha256sum registry-package.tgz | cut -d ' ' -f1)
            if [[ "$registry_sha" != "$actual_sha" ]]; then
              echo "NPM already has this version with a different tarball." >&2
              exit 1
            fi
            echo "The NPM stage was approved and the live version matches the candidate artifact."
            echo "state=published-verified" >> "$GITHUB_OUTPUT"
          else
            # The trusted publisher must allow npm stage publish, but not npm publish.
            # NPM requires a separate maintainer approval with 2FA before this version is public.
            stage_dir="$RUNNER_TEMP/package-to-stage"
            repack_dir="$RUNNER_TEMP/repacked-candidate"
            mkdir -p "$stage_dir" "$repack_dir"
            tar -xzf "$tarball" -C "$stage_dir"

            # npm stage publish packs the current working directory. Repack first and
            # require byte-for-byte identity with the immutable candidate tarball.
            (cd "$stage_dir/package" && npm pack --json --pack-destination "$repack_dir" > "$RUNNER_TEMP/repack-result.json")
            repacked_name=$(node -p "require('$RUNNER_TEMP/repack-result.json')[0].filename")
            repacked_tarball="$repack_dir/$repacked_name"
            test -f "$repacked_tarball"
            repacked_sha=$(sha256sum "$repacked_tarball" | cut -d ' ' -f1)
            test "$repacked_sha" = "$actual_sha"

            (cd "$stage_dir/package" && npm stage publish --access public --tag latest) 2>&1 | tee npm-stage-output.txt
            echo "state=staged-pending-approval" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Slack announcement draft and release evidence
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          NPM_STATE: ${{ steps.npm_stage.outputs.state }}
        run: |
          {
            echo "# ${PACKAGE_NAME}@${REQUESTED_VERSION} release"
            echo
            if [[ "$NPM_STATE" == "published-verified" ]]; then
              echo "${PACKAGE_NAME}@${REQUESTED_VERSION} is available on NPM."
            else
              echo "${PACKAGE_NAME}@${REQUESTED_VERSION} is staged on NPM and is not public yet."
              echo "Do not post this announcement until a maintainer approves the NPM stage and the live version is verified."
            fi
            echo
            echo "GitHub draft: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            if [[ "$NPM_STATE" == "published-verified" ]]; then
              echo "NPM: https://www.npmjs.com/package/${PACKAGE_NAME}/v/${REQUESTED_VERSION}"
            fi
            echo
            echo "Highlights:"
            printf '%s\n' "$RELEASE_NOTES"
          } > slack-announcement-draft.md
          {
            echo "## HPE icon NPM stage evidence"
            echo
            echo "| Evidence | Value |"
            echo "| --- | --- |"
            echo "| Package | $PACKAGE_NAME |"
            echo "| Version | $REQUESTED_VERSION |"
            echo "| Candidate run | ${{ inputs.candidate_run_id }} |"
            echo "| Commit | ${{ inputs.commit_sha }} |"
            echo "| NPM state | $NPM_STATE |"
            if [[ "$NPM_STATE" == "staged-pending-approval" ]]; then
              echo "| NPM action | Review and approve in the NPM Staged Packages page using 2FA; then rerun this workflow to verify the live tarball |"
            fi
            echo "| GitHub release | Draft; human review and publication still required |"
            echo "| Slack | Draft only; posting remains a human action |"
          } > release-evidence.md
          {
            echo "## HPE icon package stage"
            echo
            echo "| Package | Version | NPM state |"
            echo "| --- | --- | --- |"
            echo "| $PACKAGE_NAME | $REQUESTED_VERSION | $NPM_STATE |"
            if [[ "$NPM_STATE" == "staged-pending-approval" ]]; then
              echo
              echo "Review the staged package in NPM's Staged Packages page and approve it with 2FA. Then rerun this workflow with the same candidate inputs; the rerun verifies the public tarball against the candidate and does not stage again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: hpe-icons-${{ needs.prepare.outputs.package_id }}-${{ inputs.version }}-release-evidence
          path: |
            slack-announcement-draft.md
            release-evidence.md
            npm-stage-output.txt
          if-no-files-found: error
          retention-days: 90
