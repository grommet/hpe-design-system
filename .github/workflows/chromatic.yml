name: Chromatic Visual Tests
on:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - .github/workflows/chromatic.yml
      - apps/docs/src/examples/templates/**
      - packages/hpe-design-tokens/package.json
      - packages/hpe-design-tokens/src/**
      - packages/hpe-design-tokens/tokens/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - shared/aries-core/.storybook/**
      - shared/aries-core/babel.config.js
      - shared/aries-core/package.json
      - shared/aries-core/src/**
      - shared/aries-core/tsconfig.json
      - shared/aries-core/webpack.config.js
      - shared/hooks/package.json
      - shared/hooks/src/**
      - shared/hooks/tsconfig.build.esm.json
      - shared/hooks/tsconfig.json

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromatic:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' &&
      github.event.label.name == 'run-chromatic') ||
      (github.event.action != 'labeled' &&
      contains(github.event.pull_request.labels.*.name, 'run-chromatic'))))
    runs-on: ubuntu-latest
    env:
      CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHROMATIC_SLUG: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Chromatic to track changes
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build dependencies required for Storybook
      - name: Create design tokens build
        run: pnpm --filter hpe-design-tokens build

      - name: Create shared hooks build
        run: pnpm --filter "@shared/hooks" build

      - name: Create aries-core build
        run: pnpm --filter "@shared/aries-core" build

      # Run Chromatic using the official action for better GitHub integration
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: shared/aries-core
          buildScriptName: build-storybook
          onlyChanged: true
          externals: |
            packages/hpe-design-tokens/src/**
            packages/hpe-design-tokens/tokens/**
            shared/hooks/src/**
          exitZeroOnChanges: true
          autoAcceptChanges: master
