id: layout
name: Layout
description: >
  Cross-cutting rules for page structure, responsive composition, sizing, and
  spatial relationships across product UI.

rules:
  - id: layout-use-standard-routed-screen-structure
    statement: >
      Always place Page inside Main and PageContent inside Page. Never place
      Main inside Page or PageContent. For routed screens, place PageHeader
      first inside PageContent, followed by the page's content. When the
      application shell already renders Main, reuse it rather than adding a
      second Main. PageHeader renders the h1; do not add another.
    rationale: >
      Main provides the main landmark around the page and its content;
      Page and PageContent do not provide that landmark themselves.
      Page applies the theme's kind-driven max-width, alignment, and
      responsive horizontal padding; PageContent consumes them; PageHeader
      renders the title as a level-1 Heading and repositions actions on
      small screens. A page built from Box has to reproduce all of this and
      drifts when the theme changes.
    example:
      description: >
        The required nesting for a standalone screen. If the application shell
        already provides Main, render Page inside that existing Main.
      code: |
        <Main>
          <Page pad={{ bottom: '3xlarge' }}>
            <PageContent>
              <PageHeader title="Servers" />
              {/* page content */}
            </PageContent>
          </Page>
        </Main>
    relatedTo:
      - kind: component
        id: main
      - kind: component
        id: page
      - kind: component
        id: page-content
      - kind: component
        id: page-header
      - kind: pattern
        id: dashboard-layout
      - kind: external
        label: HPE Design System page layouts
        url: https://design-system.hpe.design/templates/page-layouts

  - id: layout-choose-page-kind-by-content
    statement: >
      Set kind on Page, not PageContent. Use the default, wide (max 1536px),
      for dashboards, tables, lists, and charts; narrow (max 768px) for
      forms, wizards, articles, and settings; and full for content that must
      reach the viewport edge, such as maps.
    rationale: >
      kind controls the max-width and alignment PageContent receives. Wide is
      the default and fits most application pages. Narrow exists for readable
      line length in single-task flows and would force a wide table to
      scroll inside an artificially narrow column. Every kind has a 336px
      minimum, below which content scrolls horizontally.
    relatedTo:
      - kind: component
        id: page
      - kind: external
        label: HPE Design System page kinds
        url: https://design-system.hpe.design/templates/page-layouts

  - id: layout-fill-vertical-at-page-level
    statement: >
      Make the page fill the viewport with Main, which fills vertically by
      default, or with fill on Page. Never set fill="vertical" on
      PageContent.
    rationale: >
      Without a vertically filling ancestor, a short page's background ends
      partway down the viewport, which reads as a rendering fault.
      PageContent spans the page because of its built-in fill="horizontal";
      passing fill="vertical" replaces that value and removes the horizontal
      fill, so the content may no longer span the page.
    relatedTo:
      - kind: component
        id: main
      - kind: component
        id: page-content

  - id: layout-use-semantic-region-components
    statement: >
      Use Header, Nav, Main, and Footer for the corresponding regions of the
      application, with exactly one Main per screen. Do not build these regions
      from Box. Header and Footer may also provide introductory and closing
      content within an article or section. Nav may identify navigation within
      a page.
    rationale: >
      These components render semantic HTML elements in the DOM, which expose
      landmark roles when used in the appropriate context. Screen reader users
      can navigate an application's major regions by landmark; generic
      containers alone do not provide those semantics.
    relatedTo:
      - kind: component
        id: header
      - kind: component
        id: nav
      - kind: component
        id: main
      - kind: component
        id: footer
      - kind: pattern
        id: application-shell
      - kind: external
        label: WAI-ARIA APG Landmark regions
        url: https://www.w3.org/WAI/ARIA/apg/practices/landmark-regions/

  - id: layout-use-card-for-self-contained-peers
    statement: >
      Use Card for a concise, self-contained summary of a single topic that
      can be understood independently and scanned quickly. Use Box for general
      grouping, including groups that need a styled surface but do not meet
      these Card criteria. Do not use Card merely to enclose filters or
      toolbars, and do not nest Cards.
    rationale: >
      A Card tells users that its contents summarize one topic they can
      understand without the surrounding page. A visual boundary alone does
      not make content a Card: using Card for general grouping or controls
      blurs that meaning, and a Card inside a Card doubles both the surface
      and the padding.
    relatedTo:
      - kind: component
        id: card
      - kind: component
        id: box
      - kind: glossary
        id: surface
      - kind: rule
        id: spacing-surface-padding-exceeds-inner-gap
      - kind: external
        label: HPE Design System Card principles
        url: https://design-system.hpe.design/components/card#principles
      - kind: external
        label: Nielsen Norman Group card guidance
        url: https://www.nngroup.com/articles/cards-component/

  - id: layout-use-grid-for-two-dimensions
    statement: >
      Use Grid when items must align in two dimensions or wrap into rows.
      Use Box for a single row or column.
    rationale: >
      A wrapping Box aligns items only within their own row, so wrapped cards
      come out ragged across rows. Grid aligns both axes and can place items
      by area.
    relatedTo:
      - kind: component
        id: grid
      - kind: component
        id: box

  - id: layout-use-fluid-grid-for-repeating-peers
    statement: >
      For a set of like items such as cards, tiles, or metrics, use a fluid
      grid: columns="small" or columns={{ count: 'fit', size: 'small' }}.
      Reserve explicit per-breakpoint column arrays for container-driven
      regions whose columns have distinct roles.
    rationale: >
      A fluid grid adds and removes columns as width changes, with no
      breakpoint logic, so it cannot overflow a tablet or leave empty columns
      on a wide monitor. A region layout such as filters beside results has a
      fixed role per column and is legitimately specified per breakpoint.
    relatedTo:
      - kind: component
        id: grid
      - kind: external
        label: HPE Design System content layouts
        url: https://design-system.hpe.design/templates/content-layouts
      - kind: external
        label: HPE Design System Grid
        url: https://design-system.hpe.design/components/grid

  - id: layout-use-named-grid-areas
    statement: >
      In a shell or region grid, give each region a gridArea and change
      columns, rows, and areas per breakpoint. Prefer this to conditionally
      rendering different trees.
    rationale: >
      Conditionally rendering different trees remounts components, discards
      their state, and doubles the markup that must be kept in sync. An areas
      map moves the same children without remounting them.
    relatedTo:
      - kind: component
        id: grid
      - kind: pattern
        id: application-shell

  - id: layout-validate-at-hpe-breakpoints
    statement: >
      Design and check every layout at the HPE breakpoints: xsmall, small,
      medium, large, and xlarge. Use the active HPE theme's breakpoint
      definitions for their width ranges.
    rationale: >
      These are the widths at which Grid columns, areas, and ResponsiveContext
      switch, and small is where the theme steps spacing and radius tokens
      down. A layout checked only at desktop width can pass there and break
      at every other breakpoint.
    relatedTo:
      - kind: external
        label: HPE Design System breakpoints
        url: https://design-system.hpe.design/templates/content-layouts#breakpoints

  - id: layout-use-responsive-context-for-structure
    statement: >
      Use ResponsiveContext to change structure: columns, areas, what
      renders, and where content goes. Do not use it to step spacing or
      radius down at the small breakpoint.
    rationale: >
      The theme already remaps spacing and radius tokens at small. Choosing a
      smaller token there as well compresses twice: xlarge to medium by hand,
      then medium to xsmall by the theme. Adjusting a gap at medium, where no
      remap happens, is a structural choice and is fine.
    relatedTo:
      - kind: rule
        id: spacing-use-tokens-everywhere
      - kind: rule
        id: spacing-use-element-tokens-inside-elements

  - id: layout-match-layer-type-to-interruption
    statement: >
      Use a centered modal Layer only for content that must interrupt the
      task, such as a confirmation. For supporting content the user needs
      beside the page, such as filters, details, or an add or edit form, use
      a side drawer: position="right" full="vertical", with modal={false}
      where the page must stay interactive. Use full for multi-step tasks
      that need the whole screen.
    rationale: >
      A modal Layer traps focus and blocks the page, so used for help text it
      forces a dismissal before the user can act on what it described. The
      design system defines center, side drawer, and fullscreen Layer types
      for exactly these cases.
    relatedTo:
      - kind: component
        id: layer
      - kind: external
        label: HPE Design System Layer types
        url: https://design-system.hpe.design/components/layer#types

  - id: layout-one-side-panel-on-small
    statement: >
      On xsmall and small screens, show at most one side panel at a time:
      a navigation drawer, a side drawer Layer, or a context pane. Close the
      open panel before opening another.
    rationale: >
      At the xsmall and small breakpoints each panel is full-width, so a
      second one covers the first and focus lands in whichever mounted last.
    relatedTo:
      - kind: pattern
        id: application-shell

  - id: layout-use-container-tokens-for-dimensions
    statement: >
      Use container tokens for width and height, as a fixed value such as
      width="medium" or a range such as width={{ min: 'small', max: 'medium' }}.
      Never use raw px values.
    rationale: >
      Container tokens keep panel, card, and column dimensions consistent
      across teams. Unlike spacing tokens they do not compress at the small
      breakpoint, so anything that must become narrower on mobile needs a
      range or a structural change, not a smaller number.
    relatedTo:
      - kind: rule
        id: spacing-keep-container-and-spacing-scales-apart
      - kind: external
        label: HPE Design System content container sizes
        url: https://design-system.hpe.design/foundation/content-container-sizes

  - id: layout-size-navigation-with-container-tokens
    statement: >
      Give a navigation sidebar a container-token width, either fixed
      (width="medium") or a min and max range. Do not let it size purely to
      its content.
    rationale: >
      A content-sized navigation changes width whenever its labels change,
      between routes or locales, and shifts the main content with it. A
      token range holds the shell steady while giving localized labels room
      to wrap.
    relatedTo:
      - kind: component
        id: nav
      - kind: pattern
        id: application-shell
      - kind: pattern
        id: navigation-menu

  - id: layout-constrain-long-form-text
    statement: >
      Preserve Paragraph's theme-provided maxWidth for body copy; do not
      bypass it with fill or an explicit override. Put long-form text in a
      narrow Page or a column rather than letting it run the full width of a
      wide Page.
    rationale: >
      Long lines make it harder for readers to track from the end of one line
      to the start of the next. WCAG 1.4.8 Visual Presentation (Level AAA)
      calls for a mechanism that keeps line width to no more than 80
      characters, or 40 for CJK text. The theme sets Paragraph's maxWidth
      from the text dimension tokens for each text size to keep body copy
      within a readable measure, but the token alone does not guarantee an
      exact character count or conformance.
    relatedTo:
      - kind: rule
        id: layout-choose-page-kind-by-content
      - kind: external
        label: HPE design tokens text dimensions (maxWidth)
        url: https://github.com/grommet/hpe-design-system/blob/master/packages/hpe-design-tokens/tokens/semantic/dimension.default.json
      - kind: external
        label: WCAG 2.2 Understanding Visual Presentation
        url: https://www.w3.org/WAI/WCAG22/Understanding/visual-presentation.html
