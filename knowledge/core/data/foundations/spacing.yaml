id: spacing
name: Spacing
description: >
  Cross-cutting rules for gaps, padding, and margins across product UI.

rules:
  - id: spacing-use-tokens-everywhere
    statement: >
      Express every spacing value, whether between siblings, inside a
      container, or around an element, as a reference to a named spacing
      token, never as a literal number.
    rationale: >
      Each spacing token carries a desktop value and a small-breakpoint
      value (large steps to small, medium to xsmall, and so on), and the
      consuming tool applies whichever is current. A literal number has
      nothing behind it: it holds its desktop size on mobile, ignores theme
      changes, and is invisible to audit tooling.
    relatedTo:
      - kind: rule
        id: design-tokens-grommet-uses-token-name
      - kind: rule
        id: design-tokens-non-grommet-uses-css-variables
      - kind: rule
        id: design-tokens-figma-respects-variable-scope
      - kind: rule
        id: spacing-chart-and-illustration-interiors-are-exempt

  - id: spacing-prefer-gap-and-pad-over-margin
    statement: >
      Use gap between siblings and pad inside a container. Use margin only
      when neither is possible.
    rationale: >
      Gap and pad are owned by the container, so one value controls every
      child and remaps once per breakpoint. Margins live on individual
      children, collapse unpredictably, and are hard to reason about in
      responsive layouts.
    relatedTo:
      - kind: external
        label: HPE Design System spacing best practices
        url: https://design-system.hpe.design/foundation/spacing

  - id: spacing-use-nearest-named-step
    statement: >
      Use a named spacing step. When no step is an exact fit, take the nearest
      one, preferring the smaller of two equally close steps, and report the
      gap to the design system team. Never interpolate.
    rationale: >
      The scale is closed so that every step has a defined small-breakpoint
      value. An in-between value has nothing to remap to and cannot be
      retuned centrally. Preferring the smaller step keeps groupings tight,
      and reporting the gap is how new steps enter the scale.

  - id: spacing-keep-container-and-spacing-scales-apart
    statement: >
      Never use a container token where a spacing token belongs, or the
      reverse. Spacing tokens size the space between and around things;
      container tokens size the width and height of the things themselves.
    rationale: >
      The two scales share t-shirt names but not values: spacing.medium is
      24px and container.medium is 384px, and only the spacing scale
      compresses at the small breakpoint. Grommet props keep them apart
      (pad resolves to spacing, width to container), so the risk is in CSS
      variables and Figma, where the scales sit side by side.
    relatedTo:
      - kind: rule
        id: layout-use-container-tokens-for-dimensions
      - kind: rule
        id: design-tokens-figma-respects-variable-scope

  - id: spacing-use-element-tokens-inside-elements
    statement: >
      Use element tokens for an element's own minimum height, padding,
      border, and label typography. Use spacing tokens between elements, for
      layout, and for the vertical gap between lines stacked inside an
      element.
    rationale: >
      Element tokens hold their value at every breakpoint so that a button,
      an input, and a menu item stay the same height side by side. Spacing
      tokens compress at the small breakpoint so that layouts fit. A spacing
      token inside an element shrinks it on mobile and breaks that
      alignment; an element token between elements stops the layout from
      compressing.
    relatedTo:
      - kind: rule
        id: design-tokens-use-element-tokens-for-new-elements
      - kind: rule
        id: design-tokens-stack-gaps-are-semantic
      - kind: external
        label: HPE Design System element tokens
        url: https://design-system.hpe.design/design-tokens/element

  - id: spacing-do-not-use-spacing-tokens-for-text-metrics
    statement: >
      Do not use spacing tokens for line-height or letter-spacing.
    rationale: >
      Line-height is set per text size by the typography tokens and already
      adjusts for headings at the small breakpoint. Letter-spacing is not
      tokenized and should be left at the font's default. Spacing steps are
      unrelated to type size, so borrowing one breaks vertical rhythm.

  - id: spacing-chart-and-illustration-interiors-are-exempt
    statement: >
      The interior of a chart, diagram, or illustration is exempt from spacing
      tokens. The exemption ends at the canvas edge.
    rationale: >
      Inside a canvas, position encodes data or meaning and must not remap.
      Padding around the canvas is ordinary layout spacing and uses tokens.

  - id: spacing-use-purpose-built-containers
    statement: >
      Use the purpose-built container where one exists, such as Page,
      PageContent, PageHeader, Card, Header, or Footer, rather than rebuilding
      it from Box.
    rationale: >
      These components carry the theme's page margins, max-width, and padding
      and change them per breakpoint. A Box rebuilt to match them holds a
      snapshot that drifts when the theme changes.
    relatedTo:
      - kind: rule
        id: layout-use-standard-routed-screen-structure

  - id: spacing-do-not-override-theme-owned-padding
    statement: >
      Do not pass pad to Card, PageContent, PageHeader, CardHeader, CardBody,
      or CardFooter unless you are deliberately replacing the theme's padding.
      Put gap on CardBody, not pad on Card.
    rationale: >
      On the sub-components a pad prop replaces the theme value; it does not
      merge with it. On PageContent, even pad={{ bottom: 'xlarge' }} removes
      the responsive horizontal page margins entirely. The Card container is
      the opposite case: the theme gives it no pad and pads CardHeader,
      CardBody and CardFooter instead, so pad="medium" on Card adds to the
      inset and renders content 48px from the edge instead of 24px.

  - id: spacing-parents-space-children
    statement: >
      Let the parent own the spacing. Set margin="none" on Heading and
      Paragraph when the parent already provides gap or pad.
    rationale: >
      Heading and Paragraph render with the browser's default em-based
      margins unless margin is set. Left in place, the visible gap becomes the
      parent's gap plus a margin that scales with font size instead of the
      breakpoint. Text renders a span and has no default margin.
    relatedTo:
      - kind: component
        id: heading

  - id: spacing-pad-one-side-at-shared-edge
    statement: >
      Where two padded regions meet, reduce the padding at the shared edge
      so the two sides together add up to no more than one spacing step.
      Reduce one side to a small step or zero; leave the other at its
      default.
    rationale: >
      Two abutting regions with full padding produce a double gap, which reads
      as an accidental break. CardHeader and CardBody both default to medium
      padding, so a card with both needs the shared edge collapsed. The
      design system's own Card template does this with 3xsmall on the
      header's bottom and nothing on the body's top; its dashboard cards use
      xsmall or none.
    example:
      description: >
        A card whose body drops its top padding so the header-to-body gap is
        a single medium step rather than two.
      code: |
        <Card>
          <CardHeader pad="medium">
            <Heading level={3} margin="none">Servers</Heading>
          </CardHeader>
          <CardBody pad={{ top: 'none', horizontal: 'medium', bottom: 'medium' }}>
            <Text>12 servers need attention.</Text>
          </CardBody>
        </Card>
    relatedTo:
      - kind: rule
        id: spacing-use-none-token-for-zero
      - kind: component
        id: card

  - id: spacing-use-none-token-for-zero
    statement: >
      When spacing is intentionally zero, use the none spacing token, for
      example gap="none" or pad="none". Do not write 0 or 0px, and do not
      leave the value undefined or omit it.
    rationale: >
      none is a step on the spacing scale, so it is bound like any other
      token and audit tooling can find it. It also records that the absence
      was deliberate. A raw 0 bypasses the scale, and an omitted or undefined
      value is indistinguishable from an oversight and invites someone to
      add spacing back.
    relatedTo:
      - kind: rule
        id: spacing-use-tokens-everywhere

  - id: spacing-decreases-as-things-nest
    statement: >
      Keep the gap between content groups larger than the gaps between peers
      within them. Within a section, the heading-to-body gap may match the
      gap between its cards.
    rationale: >
      Under the Gestalt principle of proximity, people perceive elements that
      sit close together as a group. Proximity is therefore the primary
      grouping signal, and HPE minimizes borders, so spacing carries most of
      the load. Equal gaps between groups and within them flatten the hierarchy.
      Within a card section, heading typography and card surfaces distinguish
      the heading from the cards even when both gaps use small.
    relatedTo:
      - kind: external
        label: Nielsen Norman Group proximity principle
        url: https://www.nngroup.com/articles/gestalt-proximity/

  - id: spacing-page-rhythm
    statement: >
      Use xxlarge between a page's primary content regions, whether arranged
      in rows or columns, xlarge between content sections, small between a
      section's heading and its body, and small by default between cards.
      Use medium between other peers inside a section. Application regions
      such as navigation and main content are separated by their own padding,
      not by a gap.
    rationale: >
      The gaps between regions and sections exceed the gaps within them.
      A section's heading-to-body gap and its card-to-card gap can both be
      small because typography and card surfaces also communicate grouping.
      At the xsmall and small breakpoints, the theme
      reduces the resolved spacing values while preserving their order; the
      selected token names stay unchanged. Existing dashboard examples may
      still use medium between cards; the default for new layouts is small.
    example:
      description: >
        A two-column dashboard page with small gaps between cards.
      code: |
        <Main>
          <Page pad={{ bottom: '3xlarge' }}>
            <PageContent>
              <PageHeader title="Dashboard" />
              <Grid columns={['flex', 'medium']} gap="xxlarge">
                <Box gap="xlarge">
                  <Box as="section" gap="small">
                    <Heading level={2} margin="none">Servers</Heading>
                    <Grid columns="small" gap="small">
                      <Card>{/* ... */}</Card>
                      <Card>{/* ... */}</Card>
                    </Grid>
                  </Box>
                  <Box as="section" gap="small">
                    <Heading level={2} margin="none">Storage</Heading>
                    {/* section body */}
                  </Box>
                </Box>
                <Box gap="xlarge">
                  {/* second column sections */}
                </Box>
              </Grid>
            </PageContent>
          </Page>
        </Main>
    relatedTo:
      - kind: rule
        id: spacing-decreases-as-things-nest
      - kind: rule
        id: spacing-parents-space-children
      - kind: rule
        id: spacing-card-grid-gaps
      - kind: glossary
        id: page-region
      - kind: glossary
        id: application-region
      - kind: glossary
        id: content-section
      - kind: pattern
        id: dashboard-layout

  - id: spacing-surface-padding-exceeds-inner-gap
    statement: >
      A surface's padding should exceed the gap between its contents. On a
      bespoke Box surface use pad="medium" with gap="small" as the default
      pairing. A Card already receives medium padding from CardBody, so set
      gap="small" on CardBody and add no pad to the Card.
    rationale: >
      If padding is not larger than the inner gap, content appears to touch
      the edge and the surface stops reading as a container. Card body
      padding defaults to medium, so small is the largest inner gap that
      keeps the relationship.
    relatedTo:
      - kind: glossary
        id: surface

  - id: spacing-card-grid-gaps
    statement: >
      Use spacing-small (16px in the default dimension mode) between cards
      by default; in Grommet, set gap="small". In a card grid, use the same gap
      for rows and columns. Make it at least one step tighter than the gap
      between surrounding content sections and no larger than the cards'
      padding.
    rationale: >
      Cards are bounded by their own surfaces and need less separation than
      unbounded sections. Unequal row and column gaps make a regular grid look
      misaligned, and a gap wider than the cards' padding makes the grid read
      as scattered fragments. The small gap is tighter than the default
      medium card padding. Consume the token rather than hardcoding 16px so
      the theme can resolve it to 8px in the small dimension mode.
    relatedTo:
      - kind: rule
        id: spacing-page-rhythm
      - kind: component
        id: card
      - kind: component
        id: grid

  - id: spacing-page-bottom-padding
    statement: >
      Give Page a bottom pad of 3xlarge. Put it on Page, not PageContent.
    rationale: >
      Trailing padding separates the final content from the page or viewport
      edge, reducing visual crowding and giving the end of the page breathing
      room at every viewport size. Page has no theme padding to disturb; a
      pad prop on PageContent would replace its responsive horizontal
      margins.
    example:
      description: >
        Page-level bottom padding inside the main landmark.
      code: |
        <Main>
          <Page pad={{ bottom: '3xlarge' }}>
            <PageContent>
              <PageHeader title="Dashboard" />
              {/* sections */}
            </PageContent>
          </Page>
        </Main>
    relatedTo:
      - kind: pattern
        id: dashboard-layout

  - id: spacing-separate-undersized-targets
    statement: >
      Keep interactive targets at least 24×24 CSS px. Where a target must be
      smaller, such as a plain icon-only Button, space it so that the centres
      of adjacent targets stay at least 24px apart at every breakpoint.
    rationale: >
      WCAG 2.2 SC 2.5.8 requires 24×24 CSS px targets, with an exception for
      undersized targets whose 24px circles do not overlap a neighbour.
      Controls sized with element tokens already meet this, so the risk is
      plain icon buttons and custom hit areas. Token values remap at the small
      breakpoint, so check the resolved size, not the token name.
    example:
      description: >
        Plain icon-only buttons render at icon size, 16px for a medium icon.
        gap="small" keeps their centres 32px apart on desktop and exactly 24px
        at the small breakpoint, where small resolves to 8px. gap="xsmall"
        would resolve to 6px there and fail.
      code: |
        <Box direction="row" gap="small">
          <Button plain a11yTitle="Edit" icon={<Edit aria-hidden="true" />} />
          <Button plain a11yTitle="Delete" icon={<Trash aria-hidden="true" />} />
        </Box>
    relatedTo:
      - kind: external
        label: WCAG 2.2 SC 2.5.8 Target Size (Minimum)
        url: https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html
      - kind: component
        id: button
