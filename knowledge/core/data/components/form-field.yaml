id: form-field
name: FormField
description: A single field in a form.
importPath: grommet
framework: react
props:
  - name: contentProps
    type: BoxProps
    required: false
    description:
      Box properties applied to the contents container, overriding theme
      properties.
  - name: disabled
    type: boolean
    required: false
    description: Whether the field appears disabled.
  - name: error
    type: string | React.ReactNode
    required: false
    description: Error text describing an issue with the field value.
  - name: help
    type: string | React.ReactNode
    required: false
    description: Help text describing how the field works.
  - name: htmlFor
    type: string
    required: false
    description: The identifier of the input element contained in the field.
  - name: info
    type: string | React.ReactNode
    required: false
    description: Informational text about the field value.
  - name: label
    type: string | React.ReactNode
    required: false
    description: A short label describing the field.
  - name: margin
    type: 'string | { bottom?: string; end?: string; horizontal?: string; left?:
      string; right?: string; start?: string; top?: string; vertical?: string }'
    required: false
    description: The margin around the field.
  - name: name
    type: string
    required: false
    description:
      The input name and Form value key, which must be supplied when using
      validate.
  - name: options
    type: string[]
    required: false
    description: ''
  - name: pad
    type: boolean
    required: false
    description: Whether to add padding aligned with TextInput padding.
  - name: placeholder
    type: string | JSX.Element | React.ReactNode
    required: false
    description: ''
  - name: required
    type: 'boolean | { indicator: boolean }'
    required: false
    description:
      Whether the field is required, with an object form that can suppress
      the required indicator.
  - name: component
    type: any
    required: false
    description: The input component inserted into the field.
  - name: validate
    type:
      "{ regexp?: object; message?: string | React.ReactNode; status?: 'error'
      | 'info' } | ((...args: any[]) => any) | ({ regexp?: object; message?:
      string | React.ReactNode; status?: 'error' | 'info' } | ((...args: any[])
      => any))[] | { max: number; threshold?: number }"
    required: false
    description:
      Validation rules for a named field within Form, including a regular
      expression, function, rule array, or character-counter configuration.
  - name: validateOn
    type: "'blur' | 'submit' | 'change'"
    required: false
    description: When to validate the field.
usage:
  whenToUse:
    - Entering a value in a form with a descriptive field label.
    - Correcting a form value using field-specific help and error messages.
    - Validating a named field as part of a Form.
  whenToAvoid: []
variants: []
examples: []
anatomy:
  - label: '1'
    region: Label
    purpose: Identifies the field.
    availability: optional
  - label: '2'
    region: Help text
    purpose: Explains how the field works.
    availability: optional
  - label: '3'
    region: Input area
    purpose: Contains the input used to enter a field value.
    availability: required
  - label: '4'
    region: Error message
    purpose: Describes an issue with the field value.
    availability: optional
  - label: '5'
    region: Informational text
    purpose: Provides additional information about the field value.
    availability: optional
behaviors:
  interactiveStates: []
  applicationStates:
    - disabled
    - error
  dataStates: []
  realEstate: []
  animation:
    references: []
contentGuidelines:
  - Keep the field label short and descriptive.
dosAndDonts:
  - do: Match htmlFor to the identifier of the contained input.
    dont: Point htmlFor at an unrelated input.
    reason: The field label must be associated with its input.
  - do: Supply a name when using validate within Form.
    dont: Configure field validation without a name.
    reason: The API requires a name when using the validate property.
accessibility:
  keyboard: []
  aria: []
  announcements: []
  wcag: []
relatedComponents: []
