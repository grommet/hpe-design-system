id: page-content
name: PageContent
description:
  Content area within Page, inside Main, that applies responsive padding and the
  max-width constraint set by the parent Page's kind. PageContent manages its own
  internal padding via the HPE theme — do not add a pad prop.
importPath: grommet
framework: react
props:
  - name: background
    type: string
    required: false
    description: Background color token (use 'background-front' for content areas)
  - name: gap
    type: string
    required: false
    description: Space between child elements
  - name: fill
    type: boolean | 'horizontal' | 'vertical'
    required: false
    description:
      Inherited Box fill. PageContent defaults to fill='horizontal' so it spans
      its Page; a caller-supplied fill replaces that default, so fill='vertical'
      removes the horizontal fill. Size the page vertically with Main, which
      fills vertically by default, or with fill on Page instead.
usage:
  whenToUse:
    - Always use PageContent inside Page, with both inside Main.
    - Use background='background-front' for visual contrast with Page.
    - Place PageHeader as the first child.
    - Set kind on the parent Page to choose the content's max-width.
  whenToAvoid:
    - Do not use outside a Page component.
    - Do not place Main inside PageContent. Reuse a shell-owned Main around Page
      rather than adding another Main.
    - Do not set explicit widths — PageContent handles responsive sizing.
    - Do not add a pad prop — PageContent's responsive padding is owned by the HPE
      theme and must not be overridden. Adding pad disrupts the standardised page
      margins across breakpoints.
    - Do not set fill='vertical' on PageContent — it replaces the default
      horizontal fill. Fill vertically with Main or Page.
examples:
  - description: Content with Background
    code:
      "<Page background=\"background-back\">\n  <PageContent background=\"background-front\"\
      \ gap=\"medium\">\n    <PageHeader title=\"Users\" />\n    <DataTable columns={columns}\
      \ data={users} />\n  </PageContent>\n</Page>"
  - description: Full-bleed dashboard content (no max-width cap)
    code:
      "<Page kind=\"full\" background=\"background-back\">\n  <PageContent gap=\"medium\"\
      >\n    <PageHeader title=\"Dashboard\" />\n    <Grid columns={{ count: 'fit', size:\
      \ 'medium' }} gap=\"medium\">\n      {metrics.map(m => <MetricCard key={m.id} {...m}\
      \ />)}\n    </Grid>\n  </PageContent>\n</Page>"
variants:
  - name: constrained-width
    description:
      "Default behaviour: content is horizontally centred and capped at the
      max-width of the parent Page's kind, wide by default. Set kind='narrow' on
      Page for text-heavy and form pages."
    when:
      Settings pages, forms, article views — anywhere reading comfort and line-length
      control matter.
    example:
      <Page kind="narrow"><PageContent gap="medium"><PageHeader title="Settings"
      />{/* form fields */}</PageContent></Page>
  - name: full-bleed
    description:
      Content stretches to the full available width with no max-width constraint.
      Set kind='full' on the parent Page to opt in.
    when:
      Dashboards, data tables, and visualisation pages where horizontal real-estate
      matters more than reading line length.
    example:
      <Page kind="full"><PageContent gap="medium"><PageHeader title="Dashboard"
      /><DataTable ... /></PageContent></Page>
anatomy:
  - label: content container
    region: root
    purpose:
      Centers and horizontally constrains the page body content, filling the
      width of its Page parent; vertical sizing belongs to Main or Page
    availability: always
  - label: content area
    region: inside container
    purpose:
      Caller-supplied children rendered within the constrained-width content
      area
    availability: always
behaviors:
  realEstate:
    - responsive
    - max-width
accessibility:
  aria:
    - attribute: no intrinsic ARIA role
      value: generic container
      condition:
        PageContent is a styled layout container inside Page; both belong inside
        Main, which provides the main landmark. Semantic content such as
        PageHeader (h1) and the document outline live inside PageContent.
  wcag:
    - criterion: 1.3.1 Info and Relationships
      status: conditional
      notes:
        - PageContent is a layout container with no semantic role. Ensure the first
          child is PageHeader (with a level={1} heading) so the document outline is
          meaningful to assistive technology.
    - criterion: 1.4.4 Resize Text
      status: pass
    - criterion: 1.4.10 Reflow
      status: pass
      notes:
        - Do not set a fixed width or overflow=hidden on PageContent. The component
          relies on the responsive max-width constraint from its parent Page's kind
          to reflow at 320 CSS px without horizontal scrolling.
    - criterion: 2.4.6 Headings and Labels
      status: conditional
      notes:
        - Always supply a title to the PageHeader child inside PageContent. A content
          area without a visible heading is not meaningfully labelled for screen reader
          users who navigate by heading.
relatedComponents:
  - page
  - page-header
  - main
